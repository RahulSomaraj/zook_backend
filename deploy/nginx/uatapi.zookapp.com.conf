# Nginx reverse proxy for the Zook backend (UAT) — HTTP only.
#
# Install on the Azure VM:
#   sudo cp deploy/nginx/uatapi.zookapp.com.conf /etc/nginx/sites-available/uatapi.zookapp.com
#   sudo ln -s /etc/nginx/sites-available/uatapi.zookapp.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# App listens on 127.0.0.1:3000  (global prefix /api, Swagger at /docs).

server {
    listen 80;
    listen [::]:80;
    server_name uatapi.zookapp.com;

    # Upload size — bump if you accept large file uploads.
    client_max_body_size 25m;

    # Logs
    access_log /var/log/nginx/uatapi.zookapp.com.access.log;
    error_log  /var/log/nginx/uatapi.zookapp.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass real client info to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
