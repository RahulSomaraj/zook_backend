name: Deploy to Azure

# Auto-deploys on every push to develop. Also runnable manually from the
# Actions tab (workflow_dispatch) with an optional branch override.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: develop

concurrency:
  # Never run two deploys at once; cancel an in-progress one if a newer push lands.
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets (AZURE_HOST, AZURE_USER, AZURE_SSH_KEY, AZURE_DEPLOY_PATH) live in
    # the "AZURE_HOST" environment, so the job must opt into that environment to
    # read them. Without this line they resolve to empty and the deploy fails.
    environment: AZURE_HOST
    steps:
      - name: Check required secrets are present
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_DEPLOY_PATH: ${{ secrets.AZURE_DEPLOY_PATH }}
          AZURE_SSH_PORT: ${{ secrets.AZURE_SSH_PORT }}
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "❌ $1 is EMPTY / not available to this job"
              missing=1
            else
              echo "✅ $1 is set (length: ${#2})"
            fi
          }
          check AZURE_HOST "$AZURE_HOST"
          check AZURE_USER "$AZURE_USER"
          check AZURE_SSH_KEY "$AZURE_SSH_KEY"
          check AZURE_DEPLOY_PATH "$AZURE_DEPLOY_PATH"
          echo "AZURE_SSH_PORT (optional): ${AZURE_SSH_PORT:-<unset, defaults to 22>}"
          if [ "$missing" = "1" ]; then
            echo "::error::One or more required secrets are missing/empty for this job."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            # appleboy/ssh-action runs a NON-interactive shell that does not read
            # ~/.bashrc or ~/.profile, so nvm-managed node/npm/npx/pm2 are not on
            # PATH. Load nvm explicitly (wrapped to tolerate `set -u`). If node is
            # installed another way, also add common global bin dirs as fallbacks.
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            set +u
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            set -u
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"

            echo ">>> Using node: $(command -v node || echo 'NOT FOUND')  npm: $(command -v npm || echo 'NOT FOUND')"

            BRANCH="${{ github.event.inputs.branch || 'develop' }}"
            DEPLOY_PATH="${{ secrets.AZURE_DEPLOY_PATH }}"
            PM2_APP_NAME="zook-backend"

            echo ">>> cd $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo ">>> Fetching latest code ($BRANCH)"
            git fetch --all --prune
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo ">>> Installing dependencies"
            npm install --legacy-peer-deps

            echo ">>> Prisma generate + migrate deploy"
            npx prisma generate
            npx prisma migrate deploy

            echo ">>> Building"
            npm run build

            echo ">>> Restarting via PM2"
            if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              pm2 start ecosystem.config.js --env production
            fi
            pm2 save

            echo ">>> Done."
            pm2 status "$PM2_APP_NAME"
